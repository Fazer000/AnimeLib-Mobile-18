name: Build Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Accept Android SDK licenses & Install Components
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Keystores and Properties
      run: |
        if [ -f "debug.keystore.base64" ]; then
          echo "Restoring debug.keystore from base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        elif [ ! -f "debug.keystore" ]; then
          echo "Generating new debug.keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
        fi

        if [ -f "release.keystore.base64" ]; then
          echo "Restoring release.keystore from base64..."
          base64 -d release.keystore.base64 > release.keystore
        elif [ ! -f "release.keystore" ]; then
          echo "Generating new release.keystore..."
          keytool -genkey -v -keystore release.keystore -storepass releasepass -alias releasekey -keypass releasepass -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AnimeLib Release, OU=Development, O=AnimeLib, L=San Francisco, ST=California, C=US"
        fi
        
        if [ ! -f "keystore.properties" ]; then
          echo "Creating keystore.properties..."
          echo "storeFile=release.keystore" > keystore.properties
          echo "storePassword=releasepass" >> keystore.properties
          echo "keyAlias=releasekey" >> keystore.properties
          echo "keyPassword=releasepass" >> keystore.properties
        fi

    - name: Build Debug & Release APK / AAB
      run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

    - name: Upload Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AnimeLib-APKs
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/debug/*.apk

    - name: Create or Update GitHub Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.7.3
        name: Release v1.7.3
        draft: false
        prerelease: false
        files: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/bundle/release/*.aab

    - name: Calculate Next Version Tag for Updater Repo
      id: bump_updater_version
      if: github.ref == 'refs/heads/main'
      run: |
        python3 -c '
        import json, urllib.request, re, os

        url = "https://api.github.com/repos/Fazer000/AnimeLib-Mobile-Updater/releases/latest"
        latest_tag = ""
        try:
            req = urllib.request.Request(url, headers={"User-Agent": "GitHub-Actions", "Accept": "application/vnd.github.v3+json"})
            with urllib.request.urlopen(req) as resp:
                data = json.loads(resp.read().decode("utf-8"))
                latest_tag = data.get("tag_name", "")
        except Exception as e:
            print(f"Could not fetch latest release tag: {e}")

        print(f"Latest tag found in AnimeLib-Mobile-Updater: \"{latest_tag}\"")

        if not latest_tag:
            new_tag = "v1.7.4"
        else:
            clean = latest_tag.lstrip("vV")
            parts = clean.split(".")
            major = parts[0] if len(parts) > 0 else "1"
            minor = parts[1] if len(parts) > 1 else "7"
            patch_str = parts[2] if len(parts) > 2 else "3"
            patch_num = int(re.sub(r"[^0-9].*", "", patch_str) or 3) + 1
            new_tag = f"v{major}.{minor}.{patch_num}"

        print(f"Calculated new tag for Updater repo: {new_tag}")
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"tag_name={new_tag}\n")
        '

    - name: Check PAT Secret for Updater Repo
      if: github.ref == 'refs/heads/main' && env.GH_PAT == ''
      run: |
        echo "::warning::Секрет GH_PAT не настроен! Автоматический деплой в сторонний репозиторий (AnimeLib-Mobile-Updater) требует Personal Access Token."
        echo "Для исправления добавьте GH_PAT в Settings -> Secrets and variables -> Actions вашего репозитория AnimeLib-Mobile."

    - name: Create GitHub Release in AnimeLib-Mobile-Updater Repo
      if: github.ref == 'refs/heads/main' && env.GH_PAT != ''
      uses: softprops/action-gh-release@v2
      with:
        repository: Fazer000/AnimeLib-Mobile-Updater
        token: ${{ secrets.GH_PAT }}
        tag_name: ${{ steps.bump_updater_version.outputs.tag_name }}
        name: Release ${{ steps.bump_updater_version.outputs.tag_name }}
        draft: false
        prerelease: false
        files: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/bundle/release/*.aab

